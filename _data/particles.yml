particles:
  - title: "Fluidity vs. Stability: Shaping Dynamic Macrostructure Within Diffusive Flows"
    id: 0
    src: "/assets/js/fluidity.bundle.js"
    permalink: "particles.html"
    description: >
      This series of particle systems visualizes my sparks, inspirations, and computational thinking in AI/ML research. <strong>EXP-0</strong> demonstrates how a seemingly continuous flow emerges from the collective behavior of homogeneous discrete particles. The experiment explores how universal principles can shape—or “tame”—a highly diffusive system into a temporarily semi-stable state with subtle macrostructures.
    references:
      - name: "Ken Perlin. <i>Improving noise.</i> ACM Transactions on Graphics, 2002."
        link: "https://dl.acm.org/doi/10.1145/566654.566636"
      - name: "Tim Severien. <i>Stable curl noise particles.</i>"
        link: "https://codepen.io/timseverien/pen/EmJNOR"
      - name: "Isaac Cohen. <i>GLSL implementation of curl noise.</i>"
        link: "https://github.com/cabbibo/glsl-curl-noise"
      - name: "Patricio Gonzalez Vivo. <i>GLSL implementation of simplex noise.</i>"
        link: "https://gist.github.com/patriciogonzalezvivo/670c22f3966e662d2f83#simplex-noise"
      - name: "The Book of Shaders. <i>Chapter 11. Noise.</i>"
        link: "https://thebookofshaders.com/11/"
      - name: "NVIDIA Developer. <i>Geometry instancing on GPU.</i>"
        link: "https://developer.nvidia.com/gpugems/gpugems2/part-i-geometric-complexity/chapter-3-inside-geometry-instancing"
    

  - title: "Laplace Operator, Convolution, and the Propagation of Heat"
    id: 1
    src: "/assets/js/heat.bundle.js"
    permalink: "heat.html"
    description: >
      <strong>EXP-1</strong> draws inspiration from the heat equilibrium equation and the Laplace operator. It showcases how heat propagation across a 2D surface can be efficiently batch-computed through a grid-based convolution operation, offering a practical approximation to continuous gradient solvers. This approach brings inherent advantages, including parallelism, computational efficiency, and adaptability for downstream tasks like identifying global maxima. Unlike continuous gradient-based solvers, which often scale at <strong>O(N<sup>2</sup>)</strong> or higher due to global dependencies, the computational complexity of this grid-based method typically scales at <strong>O(N)</strong>.
    references:
      - name: "Daniel F. Styer. <i>The geometrical significance of the Laplacian</i>. American Journal of Physics, 2015."
        link: "https://www2.oberlin.edu/physics/dstyer/Electrodynamics/Laplacian.pdf"
      - name: "Yann LeCun. <i>Convolutional networks for images, speech, and time series.</i> The handbook of brain theory and neural networks, 1995."
        link: "https://citeseerx.ist.psu.edu/document?repid=rep1&type=pdf&doi=e26cc4a1c717653f323715d751c8dea7461aa105"
      - name: "Blewitt et al. <i>Applicability of GPGPU Computing to Real-Time AI Solutions in Games</i>. IEEE Transactions on Computational Intelligence and AI in Games, 2013."
        link: "https://ieeexplore.ieee.org/abstract/document/6502211"
  - title: "Simulated Annealing, Energy Minimization, and the Travelling Salesman Problem"
    id: 2
    src: "/assets/js/heat.bundle.js"
    permalink: "simulated-annealing.html"
    description: >
      <strong>EXP-2</strong> is inspired by the simulated annealing algorithm and the travelling salesman problem. It demonstrates how a discrete optimization problem can be efficiently solved using a stochastic search algorithm that mimics the physical process of annealing. It is quite useful (and elegant) in finding global optima among large numbers of local optima. This experiment is currently WIP, and is associated with an ongoing research project.
    references:
      - name: "Kirkpatrick et al. <i>Optimization by simulated annealing</i>. Science, 1983."
        link: "https://science.sciencemag.org/content/220/4598/671"
      - name: "CMU CS. <i>What is Simulated Annealing?</i>."
        link: "https://www.cs.cmu.edu/afs/cs.cmu.edu/project/learn-43/lib/photoz/.g/web/glossary/anneal.html"

