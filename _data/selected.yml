    link: "https://www.researchsquare.com/article/rs-4509610/v1"

- title: "Learning Dense Reward with Temporal Variant Self-Supervision"
  img1: "../assets/img/selected/dense/img1.png"
  img2: "../assets/img/selected/dense/img2.png"
  author: "<strong>Yuning Wu</strong>, Jieliang Luo, Hui Li"
  occasion: "[ICRA'22] IEEE International Conference on Robotics and Automation 2022 | RL for Contact-Rich Manipulation Workshop."
  item:
  - name: "PDF"
    link: "../assets/file/icra22_dense_reward_paper.pdf"
  - name: "arXiv"
    link: "https://arxiv.org/abs/2205.10431"
  - name: "slides"
    link: "../assets/file/icra22_dense_reward_slides.pdf"
  - name: "code"
    link: "https://github.com/ICE-5/dense-reward-partial-obs/tree/robosuite"
  additional: "TL;DR: This paper introduces an efficient framework for deriving dense rewards in reinforcement learning, designed to improve the training of robots for contact-rich manipulation tasks like joint assembly and door opening. Developed in collaboration between Carnegie Mellon University and Autodesk Research, this framework employs Temporal Variant Forward Sampling (TVFS) and a self-supervised learning architecture. It leverages temporal variance and multimodal observation pairs, enabling faster and more stable policy training in a plug-and-play manner."

