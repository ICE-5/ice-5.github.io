- title: "Towards Human-Centered Construction Robotics: A Reinforcement Learning-Driven Companion Robot For Contextually Assisting Carpentry Workers"
  images:
    - "../assets/project/iros24-work-companion-robot/icon/1.png"
    - "../assets/project/iros24-work-companion-robot/icon/2.png"
  authors:
    - "Yuning Wu"
    - "Jiaying Wei"
    - "Jean Oh"
    - "Daniel Cardoso Llach"
  occasion:
    name: "IEEE/RSJ International Conference on Intelligent Robots and Systems 2024"
    badge: "IROS 2024"
  summary: >
    TL;DR: This paper outlines the development of a socially-aware "work companion robot" designed to support, rather than replace, skilled human workers by handling frequent and physically demanding tasks like on-site tool/material delivery. It details the robot's architecture, driven by recent reinforcement learning (RL) methods for social navigation, and introduces a novel pipeline for fine-tuning a pretrained RL model to adapt to specific worker behaviors, ensuring smooth Sim2Real transitions. The robot's effectiveness is validated in a real construction environment through direct worker interaction.
  resources:
    - type: "IEEE Xplore"
      link: "https://ieeexplore.ieee.org/abstract/document/10802698"
    - type: "Video"
      link: "https://youtu.be/wwta5bsOK0k"
    - type: "Slides"
      link: "../assets/project/iros24-work-companion-robot/slides.pdf"
    - type: "BibTeX"
      link: "../assets/project/iros24-work-companion-robot/citation.bib"
  theme: "How to design intelligent robots that support and understand humans?"

