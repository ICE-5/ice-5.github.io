  author: "Zhihao Fang, <strong>Yuning Wu</strong>, Ammar Hassonjee, Ardavan Bidgoli, Daniel Cardoso Llach"
  occasion: "[ACADIA 2020] Annual Conference of the Association of Computer Aided Design in Architecture 2020"
  item:
  - name: "PDF"
