- title: "Towards Human-Centered Construction Robotics: An RL-Driven Companion Robot For Contextually Assisting Carpentry Workers"
  img1: "../assets/img/selected/companion/img1.png"
  img2: "../assets/img/selected/companion/img2.png"
  author: "<strong>Yuning Wu</strong>, Jiaying Wei, Jean Oh, Daniel Cardoso Llach"
  occasion: "Under review, submitted to IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)."
  additional: "TL;DR: This paper documents the technical development of a socially-aware 'work companion robot' centered on assisting, rather than brutally replacing, human workers. By taking on the more physically burdensome tasks within an existing prototypical construction scenario, carpentry formwork, the robot aims to allow workers to focus on the more high-skilled and sophisticated facets of their daily practice. The paper offers a systematic overview of how the robot prototype is architected, driven by state-of-the-art (SoTA) reinforcement learning algorithms. It also proposes a novel pipeline for incrementally fine-tuning a pretrained RL model to align with context-specific worker behaviors and prevent drastic policy shifts during Sim2Real."
  item:
  - name: "PDF"
    link: "../assets/file/sub_companion_paper.pdf"
  - name: "arXiv"
    link: "https://arxiv.org/abs/2403.19060"
  - name: "video"
    link: "https://youtu.be/wwta5bsOK0k"
- title: "Construction as Computer-Supported Cooperative Work: Designing a Robot for Assisting Carpentry Workers"
  img1: "../assets/img/selected/reac/img1.jpeg"
  img2: "../assets/img/selected/reac/img2.png"
  author: "<strong>Yuning Wu</strong>*, Emek Erdolu*, Jiaying Wei, Jean Oh, Daniel Cardoso Llach"
  occasion: "Under review, submitted to ACM Conference on Computer Supported Cooperative Work (CSCW)."
  additional: "TL;DR: This paper reimagines the integration of robotics into highly manual construction work from a socio-technical perspective. It emphasizes the application of Computer-Supported Cooperative Work (CSCW) principles, presenting a case study on the design, development, and evaluation of a prototype robot intended to assist in carpentry formwork. This paper discusses the use of ethnographic and practice-based research methods to understand the cooperative work of construction teams and inform the design of supportive robot technologies. It proposes specific human-centered benchmarking metrics for evaluating the envisioned robot support and advocates for an approach that supports rather than completely reconfigures or replaces the human elements in existing labor-intensive work."

- title: "Correcting Sparse Erroneous Navigation Behaviors through Few-Shot Learning from Two Teachers"
  img1: 
  img2: "../assets/img/selected/vlm/img2.png"
  author: "<strong>Yuning Wu</strong>, Jean Oh"
  occasion: "In preparation."
  additional: "TL;DR: This research introduces a novel approach to address long-tailed errors in robot navigation, utilizing a Vision Language Model (VLM) and human expert preferences for corrections. By leveraging CLIP as few-shot learners, the method effectively compensates for the sparse data issue inherent in long-tailed distributions. The paper proposes a new architecture aimed at efficiently rectifying erroneous navigation behaviors and better aligning them with human preferences, offering a significant advancement in social navigation systems. This paper is currently in preparation. It will be submitted to a top-tier conference in robotics and AI."

- title: "Learning Dense Reward with Temporal Variant Self-Supervision"
  img1: "../assets/img/selected/dense/img1.png"
  img2: "../assets/img/selected/dense/img2.png"
  author: "<strong>Yuning Wu</strong>, Jieliang Luo, Hui Li"
  occasion: "[ICRA 2022] IEEE International Conference on Robotics and Automation 2022 | RL for Contact-Rich Manipulation Workshop"
  item:
  - name: "PDF"
    link: "../assets/file/icra22_dense_reward_paper.pdf"
  - name: "arXiv"
    link: "https://arxiv.org/abs/2205.10431"
  - name: "slides"
    link: "../assets/file/icra22_dense_reward_slides.pdf"
  - name: "code"
    link: "https://github.com/ICE-5/dense-reward-partial-obs/tree/robosuite"
  additional: "TL;DR: This paper introduces an efficient framework for deriving dense rewards in reinforcement learning, focusing on enhancing the efficiency and robustness of training for robots performing contact-rich manipulation tasks. Developed through collaboration between Carnegie Mellon University and Autodesk Research, the framework leverages Temporal Variant Forward Sampling (TVFS) and a self-supervised learning architecture. By utilizing temporal variance and multimodal observation pairs, the generated dense reward can facilitate faster and more stable policy training in a plug-and-play manner, examplified in tasks such as joint assembly and door opening. This work aims to share new thinkings in reward learning and its applications in robotics."

- title: "Towards a Distributed, Robotically-Assisted Construction Framework: Using Reinforcement Learning to Support Scalable Multi-Drone Construction in Dynamic Environments"
  img1: "../assets/img/selected/drone/img1.png"
