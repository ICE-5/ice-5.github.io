- title: "Towards Human-Centered Construction Robotics: An RL-Driven Companion Robot For Contextually Assisting Construction Workers"
  img1: "../assets/img/selected/companion/img1.png"
  img2: "../assets/img/selected/companion/img2.png"
  author: "<strong>Yuning Wu</strong>, Jiaying Wei, Jean Oh, Daniel Cardoso Llach"
  occasion: "[IROS'24] IEEE/RSJ International Conference on Intelligent Robots and Systems 2024."
  additional: "TL;DR: This paper outlines the development of a socially-aware ''work companion robot'' designed to support, rather than replace, skilled human workers by handling frequent and physically demanding tasks like on-site tool/material delivery. It details the robot's architecture, driven by recent reinforcement learning (RL) methods for social navigation, and introduces a novel pipeline for fine-tuning a pretrained RL model to adapt to specific worker behaviors, ensuring smooth Sim2Real transitions. The robot's effectiveness is validated in a real construction environment through direct worker interaction."
