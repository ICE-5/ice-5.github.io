    - type: "BibTeX"
      link: "../assets/project/icra22-learning-dense-reward/citation.bib"
  theme: "How to design intelligent robots that support and understand humans?"

- title: "Towards a Distributed, Robotically Assisted Construction Framework: Using Reinforcement Learning to Support Scalable Multi-Drone
Construction in Dynamic Environments"
  images:
    - "../assets/project/acadia20-multi-drone-construction/icon/1.png"
    - "../assets/project/acadia20-multi-drone-construction/icon/2.gif"
  authors:
    - "Zhihao Fang"
    - "Yuning Wu"
    - "Ammar Hassonjee"
    - "Ardavan Bidgoli"
    - "Daniel Cardoso Llach"
  occasion:
    name: "Annual Conference of the Association of Computer Aided Design in Architecture 2020"
    badge: "ACADIA 2020"
  summary: >
    TL;DR: This paper presents a distributed, robotically assisted construction framework that leverages reinforcement learning to support scalable multi-drone task coordination in dynamic work environments. The framework is designed to enable multiple drones to collaboratively build complex-shaped geometry, with a focus on the reinforcement learning-based navigation algorithm that allows 10-15 drones to collectively build the structure while avoiding collision. The paper also discusses the challenges and opportunities of using reinforcement learning in the human-centered work environments.
  resources:
