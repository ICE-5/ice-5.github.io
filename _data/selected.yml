- title: "State Space Paradox of Computational Research in Creativity"
  img1:
  img2:
  author: "Ömer Akin, <strong>Yuning Wu</strong>"
  occasion: "[HI'19] Thirtieth Anniversary 'Heron Island' Conference on Computational and Cognitive Models of Creative Design."
  item:
  - name: "PDF"
    link: "../assets/file/sub_ssp_paper.pdf"
  - name: "arXiv"
    link: "https://arxiv.org/abs/2404.15303"
  - name: "slides"
    link: "../assets/file/sub_ssp_slides.pdf"
  additional: "In memory of Professor Ömer Akin (1942-2020). This is one of his last papers, and I am privileged to be organizing and presenting it. This paper explores the State Space Paradox (SSP) in computational creativity research, discussing how current digital systems, designed as closed systems with predefined parameters, are inherently limited in their creative capacity compared to the open systems of human creativity. It examines various procedural and representational approaches to artificial creativity, such as genetic algorithms and shape grammars, and critiques their ability to truly emulate human creativity. The paradox lies in the fact that while these systems can produce outputs that may initially seem creative, they are ultimately unable to exceed their predefined state spaces and thus fail to achieve genuine novelty or adapt beyond their initial programming." 

