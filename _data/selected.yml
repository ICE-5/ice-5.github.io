  additional: "TL;DR: The paper explores an innovative framework that utilizes multi-agent reinforcement learning method (MADDPG) to enable drones to perform collaborative tasks such as bricklaying and spray-coating. This scalable, adaptive approach allows multiple drones to work in dynamic environments, promising to enhance efficiency and flexibility in construction processes. By demonstrating the framework's potential through simulations and advancing towards a hardware prototype, the study contributes to the evolving field of construction robotics by offering insights into the future of human-machine collaborative ecosystems."

- title: "Teaching an AI Agent Spatial Sense by Playing LEGO"
  img1: "../assets/img/selected/lego/img1.gif"
  img2: "../assets/img/selected/lego/img2.png"
  author: "<strong>Yuning Wu</strong>, Katerina Fragkiadaki"
  occasion: "In submission"
  additional:  "TL;DR: Whether an architect or not, how we build reflects our spatial sense of the physical world. As a child, this exploration usually starts with playing toys like building blocks. This research traces this initial, baby-step learning process through training an AI agent by playing LEGOs in a physical simulator (NVIDIA Omniverse Isaac Gym / PyBullet). A key facet is to let the AI agent gain a spatial sense by roughly understand whether a composite structure is stable or not, through the understanding of the relationships between blocks. This paper is currently in submission to a top-tier conference in AI."

- title: "State Space Paradox of Computational Research in Creativity"
  img1:
  img2:
  author: "Ömer Akin, <strong>Yuning Wu</strong>"
  occasion: "[HI'19] Thirtieth Anniversary 'Heron Island' Conference on Computational and Cognitive Models of Creative Design"
  item:
  - name: "PDF"
    link: "../assets/file/sub_ssp_paper.pdf"
  - name: "arXiv"
    link: "https://arxiv.org/abs/TBA"
  - name: "slides"
    link: "../assets/file/sub_ssp_slides.pdf"
  additional: "In memory of Professor Ömer Akin (1942-2020). This is one of his last papers. I am priviledged to be organizing and presenting it. This paper explores the State Space Paradox (SSP) in computational creativity research, discussing how current digital systems, designed as closed systems with predefined parameters, are inherently limited in their creative capacity compared to the open systems of human creativity. It examines various procedural and representational approaches to artificial creativity, such as genetic algorithms and shape grammars, and critiques their ability to truly emulate human creativity. The paradox lies in the fact that while these systems can produce outputs that may initially seem creative, they are unable to exceed their predefined state spaces and thus fail to achieve genuine novelty or adapt beyond their initial programming." 

