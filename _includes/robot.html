<div class="row" style="margin-bottom: 25px;">
  <div class="col-12" style="padding: 0; margin-bottom: 10px;">
    <h2 id="robot" data-toc-title="ROBOTS">LOVE, DEATH & ROBOTS (THAT I'VE HACKED WITH)</h2>
    <!-- <p style="font-weight: 900">•</p> -->
  </div>

  <div class="card-deck" style="padding: 0 10px;">
    {% for item in site.data.robot %}
    <div class="card" style="padding: 0; border-radius: 0; margin: 5px;">
      <!-- <img class="card-img-top" style="border-radius: 0;" src="{{ item.img }}" alt="Card image cap"> -->

      <!-- Start Carousel for each robot -->
      <div id="carousel-{{ item.name | slugify }}" class="carousel slide" data-ride="carousel" data-interval="2000">
        <div class="carousel-inner">
          <!-- First Image (Active) -->
          <div class="carousel-item active">
            <img class="d-block w-100 card-img-top" style="border-radius: 0;" src="{{ item.img }}" alt="Card image cap">
          </div>
          <!-- Optional Second Image -->
          {% if item.img2 %}
          <div class="carousel-item">
            <img class="d-block w-100 card-img-top" style="border-radius: 0;" src="{{ item.img2 }}"
              alt="Card image cap">
          </div>
          {% endif %}
          <!-- Optional Third Image -->
          {% if item.img3 %}
          <div class="carousel-item">
            <img class="d-block w-100 card-img-top" style="border-radius: 0;" src="{{ item.img3 }}"
              alt="Card image cap">
          </div>
          {% endif %}
        </div>
        <!-- Carousel controls (optional) -->
        <!-- <a class="carousel-control-prev" href="#carousel-{{ item.name | slugify }}" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carousel-{{ item.name | slugify }}" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a> -->

      </div>
      <!-- End Carousel -->


      <div class="card-body" style="padding: 10px;">
        <h3 id="robot-{{ item.name | slugify }}" class="card-title" style="margin: 0;"><strong>{{ item.name }}</strong>
        </h3>
        <p class="card-text" style="line-height: 1.1;"><small>{{ item.desc }}</small></p>
      </div>
      <!-- <div class="card-footer">
        <small class="text-muted">Last updated 3 mins ago</small>
      </div> -->
    </div>
    {% endfor %}
  </div>

</div>
