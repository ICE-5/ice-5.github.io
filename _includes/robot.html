<div class="row" style="margin-bottom: 25px;">
    <div class="col-12" style="padding: 0; margin-bottom: 10px;">
        <h2 id="robot" data-toc-title="ROBOTS">LOVE, DEATH & ROBOTS (THAT I'VE HACKED WITH)</h2>
    </div>

    <div class="card-deck" style="padding: 0 10px;">
        {% for item in site.data.robot %}
        <div class="card" style="padding: 0; border-radius: 0; margin: 5px;">

            <!-- Start Carousel for each robot -->
            <div id="carousel-{{ item.name | slugify }}" class="carousel slide" data-ride="carousel"
                data-interval="2000">
                <div class="carousel-inner">
                    {% for image in item.images %}
                    <div class="carousel-item {% if forloop.first %}active{% endif %}">
                        <img class="d-block w-100 card-img-top" style="border-radius: 0;" src="{{ image }}"
                            alt="Card image cap">
                    </div>
                    {% endfor %}
                </div>
            </div>
            <!-- End Carousel -->

            <div class="card-body" style="padding: 10px;">
                <h3 id="robot-{{ item.name | slugify }}" class="card-title" style="margin: 0;">{{ item.name }}</h3>
                <p class="card-text"><small>{{ item.desc }}</small></p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
