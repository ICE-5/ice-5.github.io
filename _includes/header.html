<header class="masthead" style="
        background-image: url('{{page.header-bgimg}}');
        background-size: auto;
        background-color: white;
        /* height: 325px; */
	">
        <div class="overlay"></div>
        <div class="container">
            <div class="row">
                <!-- <div class="col-md-10 col-lg-8 mx-auto"> -->
                <div class="col-xl-10 offset-md-0 offset-xl-1">
                    <div class="site-heading">
                        <h1 style="font-weight: 900;">{{ page.header-title }}</h1>
                        <span class="subheading">{{ page.header-subtitle }}</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <!-- <img src="/assets/img/logo.png" alt="logo" width=50> -->
                <p style="font-size: small; line-height: 0.75; font-weight: 900;">YUNING WU</p>
                <p style="font-size: small;">ML+ROBOTICS RESEARCHER / CREATOR / MAKER</p>
            </a><button data-toggle="collapse"
                data-target="#navbarResponsive" class="navbar-toggler" aria-controls="navbarResponsive"
                aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="nav navbar-nav ml-auto">
                    {% for item in site.data.nav %}
                    <li class="nav-item" role="presentation">
                        <a href="{{ item.link }}" class="nav-link">
                            {{ item.name }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </nav>
