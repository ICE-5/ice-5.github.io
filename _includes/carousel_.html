<div id="homeCarousel" class="carousel slide" data-ride="carousel" data-interval="10000" 
    style="position: absolute; top: 0; left: 0; width: 100%; height: 650px; z-index: 1;">

    <ol class="carousel-indicators" style="top: 100%; z-index: 3; position: absolute;">
        {% for item in site.data.carousel %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}" class="{% if item.index == 0 %}active{% endif %}" 
            style="background-color: white;"></li>
        {% endfor %}
    </ol>

    <!-- Carousel Inner Content -->
    <div class="carousel-inner" style="height: 100%;">
        {% for item in site.data.carousel %}
        <div class="carousel-item {% if item.index == 0 %}active{% endif %}" style="height: 100%;">

            <!-- Video Element -->
            <video class="d-block w-100" autoplay loop muted poster="{{ item.poster }}" 
                style="height: 100%; object-fit: cover;">
                <source src="{{ item.video }}" type="video/mp4" />
            </video>

            <!-- Semi-transparent Black Overlay -->
            <div class="overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 2;"></div>

            <!-- Responsive Grid for Text and Arrows -->
            <div class="container h-100" style="position: absolute; top: 0; left: 0; z-index: 3;">
                <div class="row h-100">
                    <!-- Left Arrow (1 column on large screens, hidden on small screens) -->
                    <div class="col-md-1 col-lg-1 d-flex align-items-center justify-content-center p-0">
                        <a class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev"
                            style="background-color: rgba(0, 0, 0, 0.7); width: 100%; display: flex; justify-content: center; align-items: center;">
                            <span class="carousel-control-prev-icon" aria-hidden="true"
                                style="padding: 10px; border-radius: 50%;"></span>
                            <span class="sr-only">Previous</span>
                        </a>
                    </div>

                    <!-- Centered Text (responsive width on different screen sizes) -->
                    <div class="col-md-10 col-lg-10 d-flex align-items-end justify-content-start" style="padding-left: 20px; padding-bottom: 20%;">
                        <h2 style="color: white; font-weight: bold; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);">
                            {{ item.text }}
                        </h2>
                    </div>

                    <!-- Right Arrow (1 column on large screens, hidden on small screens) -->
                    <div class="col-md-1 col-lg-1 d-flex align-items-center justify-content-center p-0">
                        <a class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next"
                            style="background-color: rgba(0, 0, 0, 0.7); width: 100%; display: flex; justify-content: center; align-items: center;">
                            <span class="carousel-control-next-icon" aria-hidden="true"
                                style="padding: 10px; border-radius: 50%;"></span>
                            <span class="sr-only">Next</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    

</div>

<!-- Spacing After Carousel -->
<div style="height: 550px;"></div>

<!-- Avatar Section -->
<div class="container">
    <div class="row">
        <div class="col-md-10 col-lg-12 mx-auto text-center">
            <!-- Your Avatar Content Here -->
            <img src="assets/img/avatar/avatar.png" class="rounded-circle" style="width: 150px;"
                onmouseover="this.src='assets/img/avatar/avatar_hover_1.jpg'"
                onmouseout="this.src='assets/img/avatar/avatar.png'" alt="Avatar" />
        </div>
    </div>
</div>
