<!-- Carousel -->
<div id="backdrop" class="carousel slide" data-ride="carousel" height="325px">

    <!-- Indicators/dots -->
    <div class="carousel-indicators">
        <button type="button" data-target="#backdrop" data-slide-to="0" class="active"></button>
        <button type="button" data-target="#backdrop" data-slide-to="1"></button>
        <button type="button" data-target="#backdrop" data-slide-to="2"></button>
    </div>

    <!-- The slideshow/carousel -->
    <div class="carousel-inner w-100">
        {% for item in site.data.carousel %}
        {% if item.index == 1 %}
        <div class="carousel-item active">
            {% else %}
            <div class="carousel-item">
                {% endif %}
                <div
                    style="background-size: auto; background-image: url('{{page.header-bgimg}}'); background-color: white;">
                </div>
                <!-- <img src="{{ item.img }}" alt="{{ item.text }} "> -->
            </div>
            {% endfor %}
        </div>

        <!-- Left and right controls/icons -->
        <button class="carousel-control-prev" type="button" data-target="#backdrop" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-target="#backdrop" data-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
