<!-- Carousel -->
<div id="backdrop" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators/dots -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#backdrop" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#backdrop" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#backdrop" data-bs-slide-to="2"></button>
    </div>

    <!-- The slideshow/carousel -->
    <div class="carousel-inner">
        {% for item in site.data.carousel %}
        {% if item.index == 1 %}
        <div class="carousel-item active">
            {% else %}
            <div class="carousel-item">
                {% endif %}
                <img src="{{ item.img }}" alt="{{ item.text }}}" class="d-block w-100">
            </div>
            {% endfor %}
        </div>

        <!-- Left and right controls/icons -->
        <button class="carousel-control-prev" type="button" data-bs-target="#backdrop" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#backdrop" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
