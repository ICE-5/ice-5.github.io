<div id="homeCarousel" class="carousel slide" data-ride="carousel" data-interval="10000"
    style="height: 700px; position: relative; overflow: hidden;">

    <!-- Indicators -->
    <ol class="carousel-indicators" style="position: absolute; bottom: 10px; z-index: 4; width: 100%; padding: 0; margin: 0;">
        {% for item in site.data.carousel %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}"
            class="{% if item.index == 0 %}active{% endif %}" style="background-color: white;"></li>
        {% endfor %}
    </ol>

    <!-- Carousel Inner -->
    <div class="carousel-inner" style="height: 100%; position: relative;">
        {% for item in site.data.carousel %}
        <div class="carousel-item {% if item.index == 0 %}active{% endif %}" style="height: 100%;">
            <!-- Video -->
            <video autoplay loop muted poster="{{ item.poster }}" class="d-block w-100"
                style="height: 100%; object-fit: cover;">
                <source src="{{ item.video }}" type="video/mp4" />
            </video>

            <!-- Semi-transparent Black Overlay -->
            <div class="overlay"
                style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 2;">
            </div>

            <!-- Diagonal Lines Masking Effect -->
            <div class="masking-layer" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 3;">
            </div>

            <!-- Responsive Overlay Text Container -->
            <div class="container text-left" style="position: absolute; bottom: 20%; left: 0; right: 0; z-index: 4;">
                <h1 class="text-white text-shadow">{{ item.title }}</h1>
                <p class="text-white text-shadow text-bold">{{ item.subtitle }}</p>
                <p class="text-white text-shadow">{{ item.text }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Controls -->
    <a class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev"
        style="z-index: 5; width: 50px;">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next"
        style="z-index: 5; width: 50px;">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
    </a>
</div>

<style>
    /* Diagonal Lines Masking Effect */
    .masking-layer {
        pointer-events: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="10" x2="10" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" /></svg>');
        background-repeat: repeat;
        background-size: 10px 10px;
    }

    /* Text Shadow */
    .text-shadow {
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* Carousel Control Hover Effect */
    .carousel-control-prev:hover,
    .carousel-control-next:hover {
        background-color: transparent !important;
    }
</style>
