<div id="homeCarousel" class="carousel slide" data-ride="carousel" data-interval="8000"
    style="height: 550px; background-color: black;">
    <ol class="carousel-indicators">
        {% for item in site.data.carousel %}
        {% if item.index == 0 %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}" class="active"></li>
        {% else %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}"></li>
        {% endif %}
        {% endfor %}

    </ol>

    <!-- inner box -->
    <div class="carousel-inner h-100">
        {% for item in site.data.carousel %}

        <!-- video background -->
        {% if item.index == 0 %}
            <div class="carousel-item active">
        {% else %}
            <div class="carousel-item">
        {% endif %}
                <video class="d-block" autoplay loop muted style="height: 475px; margin-left: auto; margin-right: auto; margin-top: 75px;">
                    <source src="{{ item.video }}" type="video/mp4" />
                </video>

                <!-- caption -->
                <div class="carousel-caption d-none d-md-block">
                    <h1 style="font-weight: 900;">{{ item.title }}</h5>
                    <p style="font-weight: 500;">{{ item.subtitle }}</p>
                    <p style="color: darkgrey;">{{ item.text }}</p>
                </div>
            </div>

        

        {% endfor %}
    </div>

    

    <!-- left button -->
    <div class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="sr-only">Previous</span>
    </div>

    <!-- right button -->
    <div class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="sr-only">Next</span>
    </div>

    <div class="overlay" />
</div>

<div style="background-color: black; height: 75px;"/>
