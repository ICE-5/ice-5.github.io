<div id="homeCarousel" class="carousel slide" data-ride="carousel" data-interval="10000"
    style="position: absolute; top: 0; left: 0; width: 100%; height: 650px; z-index: 1;">

    <!-- Indicators -->
    <ol class="carousel-indicators" style="position: absolute; bottom: 0%; z-index: 4; ">
        {% for item in site.data.carousel %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}"
            class="{% if item.index == 0 %}active{% endif %}" style="background-color: white;"></li>
        {% endfor %}
    </ol>

    <!-- Carousel Inner Content -->
    <div class="carousel-inner" style="height: 100%;">
        {% for item in site.data.carousel %}
        <div class="carousel-item {% if item.index == 0 %}active{% endif %}" style="height: 100%;">

            <!-- Video Element -->
            <video oncontextmenu="return false;" class="d-block w-100" autoplay loop muted poster="{{ item.poster }}"
                style="height: 100%; object-fit: cover; z-index: 1;">
                <source src="{{ item.video }}" type="video/mp4" />
            </video>


            <!-- Semi-transparent Black Overlay -->
            <div class="overlay"
                style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0); z-index: 2;">
            </div>

            <!-- Diagonal Lines Masking Effect -->
            <div class="masking-layer"></div>

            <!-- Responsive Overlay Text Container -->
            <div class="container" style="position: absolute; bottom: 20%; left: 0; right: 0; z-index: 3;">
                <div class="row">
                    <div class="col-md-10 col-lg-12 mx-auto text-left">
                        <h1 style="color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);">
                            {{ item.title }}
                        </h1>
                        <p style="color: white; font-weight: bold; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);">
                            {{ item.subtitle }}
                        </p>
                        <p style="color: white; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);">
                            {{ item.text }}
                        </p>
                    </div>
                </div>
            </div>

        </div>
        {% endfor %}


        <!-- left button -->
        <a class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev"
            style="z-index: 4; width: 100px;">
            <span class="carousel-control-prev-icon" aria-hidden="true"
                style="padding: 10px; border-radius: 50%;"></span>
            <span class="sr-only">Previous</span>
        </a>

        <!-- right button -->
        <a class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next"
            style="z-index: 4; width: 100px;">
            <span class="carousel-control-next-icon" aria-hidden="true"
                style="padding: 10px; border-radius: 50%;"></span>
            <span class="sr-only">Next</span>
        </a>

    </div>
</div>

<!-- Spacing After Carousel -->
<div style="height: 550px;"></div>

<!-- Avatar Section -->
<div class="container" style="position: relative; z-index: 2; top: 20px; margin-top: 0;">
    <img src="assets/img/avatar/avatar.png" class="rounded-circle" style="width: 150px;"
        onmouseover="this.src='assets/img/avatar/avatar_hover_1.jpg'"
        onmouseout="this.src='assets/img/avatar/avatar.png'" alt="Avatar" />
</div>

<style>
    /* Diagonal Lines Masking Effect */
    .masking-layer {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        pointer-events: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="10" x2="10" y2="0" stroke="rgba(0,0,0,0.3)" stroke-width="0.25" /></svg>');
        background-repeat: repeat;
        background-size: 10px 10px;
    }

    /* Remove background on hover for previous arrow */
    .carousel-control-prev:hover {
        background-color: transparent !important;
    }

    /* Remove background on hover for next arrow */
    .carousel-control-next:hover {
        background-color: transparent !important;
    }

    a:focus {
        background-color: transparent !important;
    }
</style>
