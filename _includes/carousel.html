<div id="homeCarousel" class="carousel slide" data-ride="carousel" data-interval="10000"
    style="height: 550px;">
    <ol class="carousel-indicators" style="top: 100%;">
        {% for item in site.data.carousel %}
        {% if item.index == 0 %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}" class="active"></li>
        {% else %}
        <li data-target="#homeCarousel" data-slide-to="{{ item.index }}"></li>
        {% endif %}
        {% endfor %}

    </ol>

    <!-- inner box -->
    <div class="carousel-inner" style="top: 0px">
        {% for item in site.data.carousel %}

        <!-- video background -->
        {% if item.index == 0 %}
        <div class="carousel-item active" style="top: 0;">
            {% else %}
            <div class="carousel-item" style="top: 0;">
                {% endif %}

                <video class="d-block" autoplay loop muted
                    poster="{{ item.poster }}"
                    style="height: 600px; width: 100%; position: relative; object-fit: cover; margin-top: 0px; margin-bottom: 0px;">
                    <source src="{{ item.video }}" type="video/mp4" />
                </video>


            </div>



            {% endfor %}
        </div>

        <!-- left button -->
        <div class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="sr-only">Previous</span>
        </div>

        <!-- right button -->
        <div class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="sr-only">Next</span>
        </div>

        <!-- <div class="overlay" /> -->

    </div>

    <!-- <div style="background-color: black; height: 75px;" /> -->
    <div class="container" style="position: relative; top: -10px; margin-top: 0;">
        <img src="assets/img/avatar/avatar.png" class="rounded-circle" style="width: 150px;"
            onmouseover="this.src='assets/img/avatar/avatar_hover_1.jpg'"
            onmouseout="this.src='assets/img/avatar/avatar.png'" alt="Avatar" />
    </div>
</div>
