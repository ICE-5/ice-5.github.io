<div class="row" style="margin-bottom: 25px">
  <div>
    <h2 id="update">UPDATE</h2>
    <!-- <p style="font-weight: 900">•</p> -->
    <div style="margin-top: 5px;">
    {% for item in site.data.update %}
    <p>
      <strong><tt>{{ item.time }} </tt></strong>

      {% if item.priority %}
        <span style="font-weight: 500;">{{ item.content }}</span>
      {% else %}
        <span>{{ item.content }}</span>
      {% endif %}

      {% if item.link %}
      See <a href="{{ item.link }}">{{ item.link-text }}</a> <i class="fa fa-external-link" aria-hidden="true"></i>.
      {% endif %}
    </p>
    {% endfor %}
  </div>
  </div>
</div>
