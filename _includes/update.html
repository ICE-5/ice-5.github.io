<div class="row" style="margin-bottom: 35px">
  <div>
    <h4>UPDATE</h4>
    <p style="font-weight: 900">•</p>
    {% for item in site.data.update %}
    <p>
      <strong><tt>{{ item.time }} </tt></strong>
      <span>{{ item.content }}</span> 
      {% if item.link %}
      See <a href="{{ item.link }}">{{ item.link-text }}</a> <i class="fa fa-external-link" aria-hidden="true"></i>.
      {% endif %}
    </p>
    {% endfor %}
  </div>
</div>
