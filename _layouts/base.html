<!DOCTYPE html>
<html>

<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-37BK7GVGK2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-37BK7GVGK2');
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/svg" href="/assets/img/favicon.png">

    <!-- Bundled JS by Webpack -->
    <script src="/assets/js/main.bundle.js"></script>

    <!-- (Optional) Customized font -->

    <!-- Bootstrap CSS (local) -->
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">

</head>

<body>
    {{ content }}
    {% include footer.html %}
    
    <!-- Tocbot initialization for left TOC -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            tocbot.init({
                tocSelector: '#toc',
                contentSelector: 'body',
                headingSelector: 'h2, h3',
                scrollSmooth: true,
                scrollSmoothOffset: 200,  // Adjust for a smoother experience
                collapseDepth: 6,
            });
        });
    </script>

    <!-- Scroll effect for TOC -->
    <script>
        window.addEventListener('scroll', function () {
            var tocContainer = document.getElementById('toc-container');
            var scrollPosition = window.scrollY || window.pageYOffset;
            var carouselHeight = 650; // Set the height of your carousel or the offset point
            var stickyPosition = 150; // The position you want ToC to stick to

            if (scrollPosition > carouselHeight) {
                tocContainer.style.position = 'fixed';
                tocContainer.style.top = stickyPosition + 'px';
            } else {
                tocContainer.style.position = 'absolute';
                tocContainer.style.top = carouselHeight + stickyPosition + 'px'; // Original position below the carousel
            }
        });
    </script>
</body>

</html>
