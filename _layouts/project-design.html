---
layout: main_simple
---

<div>
    <h1> {{ page.title }} </h1>
    <h2 class="text-bold"> {{ page.description }} </h2>
    <p class="text-bold"> {{ page.studio }} </p>
    <p> {{ page.designer }} </p>



    <p style="margin-top: 20px;">
        <small>
            Please contact me in advanced if you'd like to cite, refer, mention, or adapt
            this work. All rights reserved &nbsp;©&nbsp;Yuning Wu.
        </small>
    </p>

    <div>
        {% for image in page.images %}
        <img src="{{ image }}" alt="{{ page.title }}" style="width: 100%; margin-bottom: 20px;">
        {% endfor %}
    </div>
</div>
